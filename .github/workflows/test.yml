name: Test

on:
  push:
    branches: ['2.0.x']
  pull_request:
    branches: ['2.0.x']
  workflow_dispatch:

env:
  FORCE_COLOR: '1'
  LAUNCH_URL: http://drupal-core-steps-site.ddev.site
  # Accounts the users registry in cucumber.js logs in as (see README).
  DRUPAL_ADMIN_USER: admin
  DRUPAL_ADMIN_PASS: admin
  DRUPAL_EDITOR_USER: editor
  DRUPAL_EDITOR_PASS: editor
  DRUPAL_AUTHENTICATED_USER: authenticated
  DRUPAL_AUTHENTICATED_PASS: authenticated
  DRUPAL_REVIEWER_USER: reviewer_with_a_long_name
  DRUPAL_REVIEWER_PASS: reviewer

jobs:
  cucumber:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Install and start DDEV
        uses: ddev/github-action-setup-ddev@v1
        with:
          ddevDir: drupal

      - name: Build a default Drupal core site (Standard profile)
        working-directory: drupal
        run: |
          ddev composer create-project drupal/recommended-project
          ddev composer require drush/drush --no-interaction
          ddev drush site-install standard \
            --site-name="Drupal Core Steps" \
            --account-name=admin --account-pass=admin \
            --yes

      # The self-test suite needs a little more than a bare Standard install
      # (see "Run this repo's tests" in the README): two core recipes, a second
      # account for the users registry, and one article plus one media item.
      - name: Seed the fixtures the self-test suite relies on
        working-directory: drupal
        run: |
          ddev drush recipe core/recipes/article_content_type
          ddev drush recipe core/recipes/page_content_type
          ddev drush recipe core/recipes/image_media_type
          ddev drush pm:install layout_builder --yes
          ddev drush user:create "$DRUPAL_EDITOR_USER" --mail="editor@example.com" --password="$DRUPAL_EDITOR_PASS"
          ddev drush user:role:add content_editor "$DRUPAL_EDITOR_USER"
          ddev drush user:create "$DRUPAL_AUTHENTICATED_USER" --mail="authenticated@example.com" --password="$DRUPAL_AUTHENTICATED_PASS"
          mkdir -p seed && cp ../tests/seed/standard-fixtures.php seed/
          ddev drush php:script seed/standard-fixtures.php
          ddev drush cache:rebuild

      - name: Wait for the site to answer over its DDEV URL
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$LAUNCH_URL/" || true)
            [ "$code" = "200" ] && exit 0
            sleep 2
          done
          echo "Site never settled to a clean 200 response" >&2
          exit 1

      - name: Check the step examples and feature steps against the definitions
        run: npm run test:examples

      - name: Run cucumber dry-run (no ambiguous/undefined steps)
        run: npm run test:dry

      - name: Run Drupal core step tests
        run: npm test

      # The steps must not depend on the classes of core's themes: the scenarios
      # tagged @any-theme run again with Stark as the default theme, which
      # prints only what core's modules state.
      - name: Run the theme-independent scenarios under Stark
        run: |
          (cd drupal && ddev drush theme:enable stark --yes && ddev drush config:set system.theme default stark --yes && ddev drush cache:rebuild)
          WEBSHIP_REPORT_DISABLE=1 npx cucumber-js --config cucumber.js --tags '@any-theme' --format summary

      - name: Show DDEV logs
        if: always()
        working-directory: drupal
        run: ddev logs || true

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report
          path: |
            tests/reports/cucumber_report.json
            screenshots/
          retention-days: 14
