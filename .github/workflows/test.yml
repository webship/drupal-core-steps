name: Test

on:
  push:
    branches: ['2.0.x']
  pull_request:
    branches: ['2.0.x']
  workflow_dispatch:

env:
  FORCE_COLOR: '1'
  LAUNCH_URL: http://drupal-core-steps-site.ddev.site
  # The accounts of the site, which the build creates with drush and the users
  # registry in cucumber.js names. The features only log in.
  DRUPAL_ADMIN_USER: admin
  DRUPAL_ADMIN_PASS: admin
  DRUPAL_EDITOR_USER: editor
  DRUPAL_EDITOR_PASS: editor
  DRUPAL_AUTHENTICATED_USER: authenticated
  DRUPAL_AUTHENTICATED_PASS: authenticated
  DRUPAL_REVIEWER_USER: reviewer_with_a_long_name
  DRUPAL_REVIEWER_PASS: reviewer

jobs:
  cucumber:
    name: Drupal ${{ matrix.drupal }}
    runs-on: ubuntu-latest
    env:
      # cucumber.js leaves out the scenarios of the other major version.
      DRUPAL_MAJOR: ${{ matrix.drupal }}
    strategy:
      # Each Drupal version reports on its own.
      fail-fast: false
      matrix:
        drupal: ['11', '12']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Install DDEV
        uses: ddev/github-action-setup-ddev@v1
        with:
          autostart: false

      # A Standard profile installation, the accounts of the users registry and
      # the fixtures of the suite: see tests/seed/build-site.sh.
      - name: Build the Drupal ${{ matrix.drupal }} site
        run: tests/seed/build-site.sh ${{ matrix.drupal }}

      - name: Wait for the site to answer over its DDEV URL
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$LAUNCH_URL/user/login" || true)
            [ "$code" = "200" ] && exit 0
            sleep 2
          done
          echo "The site never answered 200 for /user/login" >&2
          exit 1

      - name: Check the step examples and the feature steps against the definitions
        run: npm run test:examples

      - name: Dry run (no undefined and no ambiguous step)
        run: npm run test:dry

      - name: Run the suite
        run: npm test

      # The steps must not depend on the classes of core's themes: the scenarios
      # tagged @any-theme run again with Stark as the default theme, which
      # prints only what core's modules state.
      - name: Run the theme-independent scenarios under Stark
        run: |
          (cd drupal && ddev drush theme:enable stark --yes && ddev drush config:set system.theme default stark --yes && ddev drush cache:rebuild)
          WEBSHIP_REPORT_DISABLE=1 npx cucumber-js --config cucumber.js --tags '@any-theme' --format summary --format json:tests/reports/cucumber_report_any_theme.json

      # Optional steps, proven on their own: the one feature that creates and
      # removes accounts through the People administration, with its own registry.
      - name: Run the optional provisioning feature
        run: WEBSHIP_REPORT_DISABLE=1 npm run test:provisioning

      - name: Show DDEV logs
        if: always()
        working-directory: drupal
        run: ddev logs || true

      - name: Upload the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report-drupal-${{ matrix.drupal }}
          path: |
            tests/reports/*.json
            screenshots/
          retention-days: 14
